name: Latest book list from a goodreads
on:
  schedule: # Run workflow automatically
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
    # Run workflow manually (without waiting for the cron to be called), through the Github Actions Workflow page directly
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme-with-goodreads-books:
    name: Update this repo's README with what you're currently reading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: emergerrrd/goodreads-profile-workflow@main
        with:
          # Replace this with your goodreads user id
          goodreads_user_id: "12084710"
          shelf: "currently-reading"
          comment_tag_name: "GOODREADS-CURRENTLY-READING"
          max_books_count: "2"
          template: "[$title]($url) by $author"
          sort_by_fields: ">user_date_added"
          separator: ", "
      - uses: emergerrrd/goodreads-profile-workflow@main
        with:
          goodreads_user_id: "12084710"
          shelf: "read"
          comment_tag_name: "GOODREADS-READ"
          max_books_count: "1"
          template: "[$title]($url) by $author"
          sort_by_fields: ">user_read_at"
          separator: ", "
